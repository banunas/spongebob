<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('협찬요청', 'request-new', ~{::main})}">
<body>
<main>
    <h1>협찬 요청</h1>
    <p style="color:#555;">행사와 기업을 선택해 협찬을 요청하세요.</p>

    <!-- 에러 메시지 -->
    <div th:if="${errorMessage}"
         style="background:#fff3cd; border:1px solid #ffc107; border-radius:4px; padding:10px 14px; margin-bottom:16px; color:#856404;">
        <strong>오류:</strong> <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/requests}" th:object="${request}" method="post"
          style="max-width:480px;">

        <table style="border:none; width:100%;">
            <colgroup>
                <col style="width:100px;">
                <col>
            </colgroup>
            <tbody>
                <tr>
                    <th style="border:none; padding:10px 0; font-weight:600;">학생단체</th>
                    <td style="border:none; padding:10px 0;">
                        <input type="text" value="이화여대 컴퓨터공학과 학생회 (커밋)"
                               disabled style="width:100%; padding:6px 8px; border:1px solid #ccc; border-radius:4px; background:#f5f5f5; color:#555;">
                    </td>
                </tr>
                <tr>
                    <th style="border:none; padding:10px 0; font-weight:600;">행사 <span style="color:red;">*</span></th>
                    <td style="border:none; padding:10px 0;">
                        <select th:field="*{eventId}" required
                                style="width:100%; padding:6px 8px; border:1px solid #ccc; border-radius:4px;">
                            <option value="">선택하세요</option>
                            <option th:each="e : ${events}"
                                    th:value="${e.eventId}"
                                    th:text="${e.eventName}">봄 대동제</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th style="border:none; padding:10px 0; font-weight:600;">기업 <span style="color:red;">*</span></th>
                    <td style="border:none; padding:10px 0;">
                        <select th:field="*{companyId}" required
                                style="width:100%; padding:6px 8px; border:1px solid #ccc; border-radius:4px;">
                            <option value="">선택하세요</option>
                            <option th:each="c : ${companies}"
                                    th:value="${c.companyId}"
                                    th:text="${c.companyName}">도미노피자</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th style="border:none; padding:10px 0; font-weight:600;">수량 <span style="color:red;">*</span></th>
                    <td style="border:none; padding:10px 0;">
                        <input type="number" th:field="*{quantity}" min="1" required
                               placeholder="예: 50"
                               style="width:120px; padding:6px 8px; border:1px solid #ccc; border-radius:4px;">
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top:20px; display:flex; gap:10px;">
            <button type="submit"
                    style="background:#1d7923; color:white; border:none; padding:8px 20px; border-radius:4px; cursor:pointer; font-size:14px;">
                요청하기
            </button>
            <a href="/requests"
               style="padding:8px 16px; border:1px solid #ccc; border-radius:4px; text-decoration:none; color:#333; font-size:14px;">
                취소
            </a>
        </div>
    </form>
</main>
</body>
</html>
