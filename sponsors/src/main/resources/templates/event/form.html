<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('행사등록', 'event-new', ~{::main})}">
<body>
<main>
    <h1 class="page-title">행사등록</h1>
    <p class="page-subtitle">새 행사 정보를 입력하세요</p>

    <div class="card">
        <form th:action="@{/events}" th:object="${event}" method="post">
            <div class="form-group">
                <label>행사이름</label>
                <input type="text" th:field="*{eventName}" required placeholder="예: 봄 대동제">
            </div>

            <div class="form-group">
                <label>날짜</label>
                <input type="date" th:field="*{eventDate}" required>
            </div>

            <div class="form-group">
                <label>장소</label>
                <input type="text" th:field="*{venue}" placeholder="예: 운동장">
            </div>

            <div class="form-group">
                <label>예상 참여 인원</label>
                <input type="number" th:field="*{expectedAttendees}" min="1" required placeholder="예: 1000">
            </div>

            <div class="form-actions">
                <a href="/events" class="btn btn-outline">취소</a>
                <button type="submit" class="btn">등록</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
