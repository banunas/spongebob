<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | 협찬 통합 관리 시스템'">협찬 통합 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="/">협찬 통합 관리 시스템</a>
            <nav class="nav">
                <a href="/"          th:classappend="${active=='home'}     ? 'active'">홈</a>
                <a href="/requests/new" th:classappend="${active=='request-new'} ? 'active'">협찬요청</a>
                <a href="/requests"  th:classappend="${active=='request'}  ? 'active'">협찬목록</a>
                <a href="/events/new"   th:classappend="${active=='event-new'}   ? 'active'">행사등록</a>
                <a href="/events"    th:classappend="${active=='event'}    ? 'active'">행사목록</a>
                <a href="/stats"     th:classappend="${active=='stats'}    ? 'active'">통계</a>
                <a href="/company/requests" th:classappend="${active=='company'} ? 'active'">기업관리</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div th:replace="${content}"></div>
    </main>
</body>
</html>
